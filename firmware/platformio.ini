[platformio]
default_envs = esp32c3_usb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/secure_nimble.py
lib_deps =
  h2zero/NimBLE-Arduino@2.3.6
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  -D CONFIG_BT_NIMBLE_MAX_BONDS=3
  -D MYNEWT_VAL_BLE_SM_LEGACY=0
  -D MYNEWT_VAL_BLE_SM_SC_ONLY=1

; C3 native USB Serial/JTAG: command ingress only, not USB HID.
[env:esp32c3_usb]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; Boards whose USB connector goes through a USB-UART bridge.
[env:esp32c3_uart]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags}

; S3 native USB OTG: composite CDC command ingress + keyboard/mouse HID.
; Use the native USB connector, not a board's USB-UART-only connector.
[env:esp32s3_usb]
board = esp32-s3-devkitc-1
build_unflags = -D ARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1

; Commands through UART0 USB bridge; native USB remains available for HID output.
[env:esp32s3_uart]
board = esp32-s3-devkitc-1
build_unflags = -D ARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0

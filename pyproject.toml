[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "espcomputeruse"
version = "0.2.0"
description = "Hardware input adapter and MCP plugin for ESP32-C3 BLE and ESP32-S3 BLE/USB HID"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "Pillow>=11,<13", "mss>=10,<11",
  "pyserial>=3.5,<4", "bleak>=1,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "mcp>=1.20,<2",
  "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
  "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "build>=1.2,<2", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]

[project.scripts]
esp-use = "espcomputeruse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
espcomputeruse = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
